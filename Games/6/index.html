<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Pixel Warfare 4</title>
<link rel="shortcut icon" href="Build/favicon.ico">
<link rel="stylesheet" href="../main.css" />
<script src="/gl.js"></script>
</head>
<body>
<div class="webgl-content">
    <canvas id="canvas" class="emscripten" oncontextmenu="event.preventDefault()"></canvas>
    <div id="loadingScreen">
        <div class="loading-card">
            <img class="loading-image"id="loadingImage">
            <div class="loading-progress">
                <div class="loading-fill"id="loadingFill"></div>
            </div>
            <div class="loading-bottom">
                <div class="game-info">
                    <img class="game-icon"src="Icon.webp">
                    <div>
                        <div class="game-title">PIXEL WARFARE 4</div>
                        <div class="game-subtitle">MULTIPLAYER GAME</div>
                    </div>
                </div>
                <div class="status-area">
                    <div id="downloadInfo">0 MB / 0 MB</div>
                    <span id="statusText">DOWNLOADING GAME 0%</span>
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="timestamp" id="timestamp">00:00:00</div>
        </div>
    </div>
    <div class="play-overlay"id="playOverlay">
        <button class="play-btn" id="playButton">▶ PLAY</button>
    </div>
    <div class="game-bar">
        <button class="game-btn"onclick="gameInstance && gameInstance.SetFullscreen(1)">Fullscreen</button>
        <button class="game-btn"onclick="location.reload()">Reload</button>
    </div>
</div>
<script>
var gameStarted = false;
var gameInstance = null;
function setStatus(text){var el = document.getElementById("statusText");if(el) el.textContent = text;}
var Module = {
    TOTAL_MEMORY:536870912,
    errorhandler:null,
    compatibilitycheck:null,
    dataUrl:"Build/Game.data",
    codeUrl:"Build/Game.js",
    memUrl:"Build/Game.mem",
    realDownloadInfo:{loaded:0,total:0},
    setStatus:function(text){LOG("INFO", `SETSTATUS: ${text}`);var m = text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);if(m){var loaded = parseFloat(m[2]);var total = parseFloat(m[4]);this.realDownloadInfo.loaded = loaded;this.realDownloadInfo.total = total;var percent = total > 0 ? loaded / total : 0;var fill = document.getElementById("loadingFill");var status = document.getElementById("statusText");var info = document.getElementById("downloadInfo");if(fill) fill.style.width = (percent * 100) + "%";if(status) status.textContent = "DOWNLOADING GAME " + Math.floor(percent * 100) + "%";if(info) info.textContent = loaded.toFixed(1) + " MB / " + total.toFixed(1) + " MB";}else{var status = document.getElementById("statusText");if(status) status.textContent = text;}}
};
function startGame(){
    startImages()
    if(gameStarted)return;
    gameStarted = true;
    document.getElementById("playOverlay").style.display = "none";
    document.getElementById("loadingScreen").style.display = "flex";
    document.getElementById("downloadInfo").textContent = "0 MB / 0 MB";
    document.getElementById("loadingFill").style.width = "0%";
    setStatus("PREPARING LOAD 0%");
    loadGameLoader();
}
function formatBytes(bytes){if(bytes < 1024)return bytes+" B";if(bytes < 1024*1024)return (bytes/1024).toFixed(1)+" KB";return (bytes/1024/1024).toFixed(1)+" MB";}
var currentLoadingImage = 1;
var loadingImage = document.getElementById("loadingImage");
var loadingImageStarted = false;
var loadingImageTimer = null;
function startImages(){
    if(loadingImageStarted) return;
    loadingImageStarted = true;
    currentLoadingImage = Math.floor(Math.random() * 10) + 1;
    loadingImage.src = "thumb/img" + currentLoadingImage + ".jpg";
    loadingImageTimer = setInterval(function(){
        var screen = document.getElementById("loadingScreen");
        if(!screen || screen.classList.contains("hide"))return;
        loadingImage.style.opacity = "0";
        setTimeout(function(){
            currentLoadingImage++;
            if(currentLoadingImage > 10)currentLoadingImage = 1;
            loadingImage.src = "thumb/img" + currentLoadingImage + ".jpg";
            loadingImage.onload = function(){loadingImage.style.opacity = "1";};
        },300);
    },5000);
}
function stopImages(){if(loadingImageTimer){clearInterval(loadingImageTimer);loadingImageTimer=null}loadingImageStarted=false;if(loadingImage){loadingImage.style.opacity="0";loadingImage.src=""}}
function updateTimestamp(){
    var now=new Date();
    var unix = Math.floor(now.getTime()/1000);
    document.getElementById("timestamp").innerHTML = "TIME: "+ now.getFullYear()+"-"+ String(now.getMonth()+1).padStart(2,"0")+"-"+ String(now.getDate()).padStart(2,"0")+" "+ String(now.getHours()).padStart(2,"0")+":"+ String(now.getMinutes()).padStart(2,"0")+":"+ String(now.getSeconds()).padStart(2,"0")+ "<br>UNIX: "+ unix;
}

setInterval(updateTimestamp,1000);
function loadGameLoader(){LOG("INFO","Loading GameLoader.js");var script = document.createElement("script");script.src="Build/GameLoader.js";script.onload=function() {LOG("SUCCESS","GameLoader.js loaded");hookStatus();};script.onerror=function() {LOG("ERROR","Failed loading GameLoader.js");};document.body.appendChild(script);}

function hookStatus(){if(!Module){LOG("ERROR","Module missing");return}var oldStatus=Module.setStatus;Module.setStatus=function(text){LOG("INFO","STATUS: "+text);var displayText=text;var m=text.match(/\((\d+(\.\d+)?)\/(\d+)\)/);if(m){var loaded=parseFloat(m[1]);var total=parseFloat(m[3]);var percent=total?loaded/total:0;var fill=document.getElementById("loadingFill");var status=document.getElementById("statusText");if(fill)fill.style.width=percent*100+"%";displayText=text+" | "+Math.floor(percent*100)+"%";if(status)status.textContent=displayText}else{var status=document.getElementById("statusText");if(status)status.textContent=text}if(text===""||text==="Creating WebGL"){var screen=document.getElementById("loadingScreen");if(screen){screen.style.opacity="0";setTimeout(function(){screen.style.display="none";document.getElementById("canvas").style.opacity="1";stopImages()},500)}}if(typeof oldStatus==="function")oldStatus.call(Module,text)}}

document.getElementById("playButton").onclick = function()
{startGame();document.getElementById("playOverlay").style.display="none";};
setInterval(function(){if(!gameInstance || !gameInstance.Module || !gameInstance.Module.realDownloadInfo)return;const info = gameInstance.Module.realDownloadInfo;document.getElementById("downloadInfo").innerHTML = formatBytes(info.loaded) + " / " + formatBytes(info.total);},100);
</script>
<script>window.midrollSurprise=function(){return false;};</script>
</body>
</html>
