<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Pixel Warfare 4</title>
<link rel="shortcut icon" href="Build/favicon.ico">
<link rel="stylesheet" href="../main.css" />
</head>
<body>
<div class="webgl-content">
    <canvas id="canvas"class="emscripten"oncontextmenu="event.preventDefault()"style="width:1280px;height:720px;"></canvas>
    <div id="loadingScreen">
        <div class="loading-card">
            <img class="loading-image"id="loadingImage"src="thumb/img1.jpg">
            <div class="loading-progress">
                <div
                    class="loading-fill"
                    id="loadingFill">
                </div>
            </div>
            <div class="loading-bottom">
                <div class="game-info">
                    <img class="game-icon"src="Icon.webp">
                    <div>
                        <div class="game-title">PIXEL WARFARE 4</div>
                        <div class="game-subtitle">MULTIPLAYER GAME</div>
                    </div>
                </div>
                <div class="status-area">
                    <div id="downloadInfo">0 MB / 0 MB</div>
                    <span id="statusText">DOWNLOADING GAME 0%</span>
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="timestamp" id="timestamp">00:00:00</div>
        </div>
    </div>
    <div class="play-overlay"id="playOverlay">
        <button class="play-btn" id="playButton">

            ▶ PLAY

        </button>
    </div>
    <div class="game-bar">
    <button class="game-btn"onclick="gameInstance && gameInstance.SetFullscreen(1)">Fullscreen</button>
    <button class="game-btn"onclick="location.reload()">Reload</button>
</div>
</div>
<script>

var gameStarted = false;
var gameInstance = null;


function setStatus(text)
{
    var el = document.getElementById("statusText");

    if(el)
        el.textContent = text;
}


var Module = {
    TOTAL_MEMORY:536870912,

    errorhandler:null,
    compatibilitycheck:null,

    dataUrl:"Build/Game.data.gz",
    codeUrl:"Build/Game.js.gz",
    memUrl:"Build/Game.mem.gz"
};



function startGame()
{
    if(gameStarted)
        return;

    gameStarted = true;

    document.getElementById("playOverlay").style.display = "none";
    document.getElementById("loadingScreen").style.display = "flex";

    document.getElementById("downloadInfo").textContent =
        "0 MB / 0 MB";

    document.getElementById("loadingFill").style.width =
        "0%";

    setStatus("DOWNLOADING GAME 0%");

    loadGameLoader();
}


function formatBytes(bytes)
{
    if(bytes < 1024)
        return bytes+" B";


    if(bytes < 1024*1024)
        return (
            bytes/1024
        ).toFixed(1)+" KB";


    return (
        bytes/1024/1024
    ).toFixed(1)+" MB";
}




var currentLoadingImage =
    Math.floor(
        Math.random()*10
    )+1;


var loadingImage =
    document.getElementById(
        "loadingImage"
    );


if(loadingImage)
{
    loadingImage.src =
        "thumb/img"+
        currentLoadingImage+
        ".jpg";
}



setInterval(function(){

    var screen =
        document.getElementById(
            "loadingScreen"
        );


    if(!screen ||
       screen.classList.contains("hide"))
        return;


    loadingImage.style.opacity="0";


    setTimeout(function(){

        currentLoadingImage++;


        if(currentLoadingImage > 10)
            currentLoadingImage=1;


        loadingImage.src =
            "thumb/img"+
            currentLoadingImage+
            ".jpg";


        loadingImage.onload=function()
        {
            loadingImage.style.opacity="1";
        };


    },300);


},5000);





function updateTimestamp()
{
    var now=new Date();


    var unix =
        Math.floor(
            now.getTime()/1000
        );


    document.getElementById(
        "timestamp"
    ).innerHTML =
        "TIME: "+
        now.getFullYear()+"-"+
        String(now.getMonth()+1).padStart(2,"0")+"-"+
        String(now.getDate()).padStart(2,"0")+" "+
        String(now.getHours()).padStart(2,"0")+":"+
        String(now.getMinutes()).padStart(2,"0")+":"+
        String(now.getSeconds()).padStart(2,"0")+
        "<br>UNIX: "+
        unix;
}

setInterval(
    updateTimestamp,
    1000
);

function loadGameLoader()
{
    var script = document.createElement("script");
    script.src = "Build/GameLoader.js";
    document.body.appendChild(script);
}

updateTimestamp();

document.getElementById("playButton").onclick = function()
{
    startGame();

    document.getElementById("playOverlay").style.display="none";
};
setInterval(function(){

    if(
        !gameInstance ||
        !gameInstance.Module ||
        !gameInstance.Module.realDownloadInfo
    )
        return;

    const info =
        gameInstance.Module
        .realDownloadInfo;

    document.getElementById(
        "downloadInfo"
    ).innerHTML =
        formatBytes(
            info.loaded
        ) +
        " / " +
        formatBytes(
            info.total
        );

},100);
</script>
<script>
window.midrollSurprise=function()
{
    return false;
};
</script>
</body>
</html>
