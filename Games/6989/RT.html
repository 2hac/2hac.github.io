<div class="panel">
    <div class="header">
        <span>Transfer Data</span>
        <button class="close-btn"
                onclick="document.querySelector('.panel').style.display='none'">
            X
        </button>
    </div>

    <div class="content">
        <p>Request data transfer to the new application.</p>

        <form id="transferForm">
            <input type="text"
                   id="username"
                   placeholder="Username"
                   required>

            <input type="text"
                   id="transferCode"
                   placeholder="Transfer Code"
                   required>

            <p>
                Transfer requests may take some time to process due to the
                large number of users.
            </p>

            <button type="submit" class="submit-btn">
                Submit
            </button>

            <div id="status"></div>
        </form>
    </div>
</div>
