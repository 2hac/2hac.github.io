<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Pixel Warfare 5</title>
<link rel="shortcut icon" href="Build/favicon.ico">
<link rel="stylesheet" href="../main.css" />
<script src="/gl.js"></script>
<script src="Build/UnityProgress.js"></script>
<script src="Build/Game.js"></script>
</head>
<body>
<div class="webgl-content">
    <div id="gameContainer"></div>
    <div id="loadingScreen">
        <div class="loading-card">
            <img class="loading-image"id="loadingImage">
            <div class="loading-progress">
                <div class="loading-fill"id="loadingFill"></div>
            </div>
            <div class="loading-bottom">
                <div class="game-info">
                    <img class="game-icon"src="Icon.webp">
                    <div>
                        <div class="game-title">PIXEL WARFARE 5</div>
                        <div class="game-subtitle">MULTIPLAYER GAME</div>
                    </div>
                </div>
                <div class="status-area">
                    <div id="downloadInfo">0 MB / 0 MB</div>
                    <span id="statusText">DOWNLOADING GAME 0%</span>
                    <div class="spinner"></div>
                </div>
            </div>
            <div class="timestamp" id="timestamp">00:00:00</div>
        </div>
    </div>
    <div class="play-overlay" id="playOverlay">
        <button class="play-btn" id="playButton">▶ PLAY</button>
    </div>
    <div class="game-bar">
        <b style="color: rgb(53, 53, 53);">Work in progress. Some stuff may not work as expected, all PW5 maps are stored just not available yet</b>
        <button class="game-btn" id="fullscreenButton">Fullscreen</button>
        <button class="game-btn" id="reloadButton">Reload</button>
    </div>
</div>
<script>
var gameInstance = null;
function setStatus(text){document.getElementById("statusText").textContent = text;}
function startGame(){startImages();document.getElementById("playOverlay").style.display = "none";document.getElementById("loadingScreen").style.display = "flex";gameInstance = UnityLoader.instantiate("gameContainer","Build/Game.json",{onProgress:function(game,progress){var percent = Math.floor(progress * 100);document.getElementById("loadingFill").style.width =percent + "%";if(progress < 1){setStatus("DOWNLOADING GAME "+percent+"%");}else{setStatus("PROCESSING FILES");document.querySelector(".spinner").style.display = "block";setTimeout(function(){setStatus("STARTING GAME");setTimeout(function(){document.getElementById("gameContainer").style.opacity = "1";stopImages();document.getElementById("loadingScreen").classList.add("hide");},1500);},1500);}}});}
async function getFileSize(url){try{const response = await fetch(url,{method:"HEAD"});return parseInt(response.headers.get("Content-Length") || "0");}catch(e){return 0;}}
function formatBytes(bytes){if(bytes < 1024) return bytes + " B";if(bytes < 1024*1024) return (bytes / 1024).toFixed(1) + " KB";return (bytes / 1024 / 1024).toFixed(1) + " MB";}
var currentLoadingImage = 1;
var loadingImage = document.getElementById("loadingImage");
var loadingImageStarted = false;
var loadingImageTimer = null;
function startImages(){
    if(loadingImageStarted) return;
    loadingImageStarted = true;
    currentLoadingImage = Math.floor(Math.random() * 10) + 1;
    loadingImage.src = "thumb/img" + currentLoadingImage + ".jpg";
    loadingImageTimer = setInterval(function(){
        var screen = document.getElementById("loadingScreen");
        if(!screen || screen.classList.contains("hide"))return;
        loadingImage.style.opacity = "0";
        setTimeout(function(){
            currentLoadingImage++;
            if(currentLoadingImage > 10)currentLoadingImage = 1;
            loadingImage.src = "thumb/img" + currentLoadingImage + ".jpg";
            loadingImage.onload = function(){loadingImage.style.opacity = "1";};
        },300);
    },5000);
}
function stopImages(){if(loadingImageTimer){clearInterval(loadingImageTimer);loadingImageTimer=null}loadingImageStarted=false;if(loadingImage){loadingImage.style.opacity="0";loadingImage.src=""}}
function updateTimestamp(){
    const now = new Date();
    const unixTs = Math.floor(now.getTime() / 1000);
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2,"0");
    const day = String(now.getDate()).padStart(2,"0");
    const hours = String(now.getHours()).padStart(2,"0");
    const minutes = String(now.getMinutes()).padStart(2,"0");
    const seconds = String(now.getSeconds()).padStart(2,"0");
    document.getElementById("timestamp").innerHTML = "TIME: " + year + "-" + month + "-" + day + " " + hours + ":" + minutes + ":" + seconds + "<br>" + "UNIX: " + unixTs + "<br>" + "Seconds since January 1st 1970. (UTC)";
}
updateTimestamp();
function openTransferWindow(){document.getElementById("transferOverlay").style.display = "flex";}
function closeTransferWindow(){document.getElementById("transferOverlay").style.display = "none";}

setInterval(function(){if(!gameInstance || !gameInstance.Module || !gameInstance.Module.realDownloadInfo)return;const info = gameInstance.Module.realDownloadInfo;document.getElementById("downloadInfo").innerHTML = formatBytes(info.loaded) + " / " + formatBytes(info.total);},100);
// BEGIN Events
var playButton = document.getElementById("playButton");
const fullscreenButton = document.getElementById("fullscreenButton");
const reloadButton = document.getElementById("reloadButton");
if(playButton){playButton.addEventListener("click", function(){startGame();});}
if(fullscreenButton){fullscreenButton.addEventListener("click", function(){if(gameInstance){gameInstance.SetFullscreen(1);}});}
if(reloadButton){reloadButton.addEventListener("click", function(){location.reload();});}
// END Events
</script>
</body>
</html>
