<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity WebGL Player | WebGL Player</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #unity-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        display: none; /* hide until play button pressed */
      }

      canvas#unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Your play button styles */
      .css-5op8vq {
        color: rgb(255, 255, 255);
        box-shadow: rgb(225, 0, 255) 0px 0px 50px;
        text-transform: capitalize;
        font-size: 1.3em;
        font-weight: 800;
        cursor: pointer;
        transform: perspective(1px) translateZ(0px);
        transition-duration: 0.2s;
        font-family: Nunito, Arial, "Helvetica Neue", Helvetica, sans-serif;
        background-color: rgb(104, 66, 255);
        -webkit-box-align: center;
        align-items: center;
        display: inline-flex;
        -webkit-box-pack: center;
        justify-content: center;
        position: relative;
        border-radius: 80px;
        padding: 14px 30px;
        gap: 5px;
        border-width: 0px;
      }

      /* Center container for the play button */
      #play-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        top: 0;
        left: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #000000cc; /* semi-transparent black overlay */
        z-index: 9999;
      }
    </style>
  </head>
  <body>
    <!-- Play Button Container -->
    <div id="play-container">
      <button class="css-5op8vq" id="play-button" aria-label="Play here">
        Play here
        <svg
          class="MuiSvgIcon-root MuiSvgIcon-fontSizeMedium css-14yq2cq"
          focusable="false"
          aria-hidden="true"
          viewBox="0 0 24 24"
          width="24"
          height="24"
        >
          <path
            d="M10 15.0657V8.93426C10 8.53491 10.4451 8.29671 10.7773 8.51823L15.376 11.584C15.6728 11.7819 15.6728 12.2181 15.376 12.416L10.7774 15.4818C10.4451 15.7033 10 15.4651 10 15.0657Z"
          ></path>
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M9.5 15.0657V8.93426C9.5 8.13556 10.3901 7.65917 11.0547 8.10221L15.6533 11.1679C16.247 11.5638 16.247 12.4362 15.6533 12.8321L11.0547 15.8978C10.3901 16.3408 9.5 15.8644 9.5 15.0657ZM10 8.93426V15.0657C10 15.4651 10.4451 15.7033 10.7774 15.4818L15.376 12.416C15.6728 12.2181 15.6728 11.7819 15.376 11.584L10.7773 8.51823C10.4451 8.29671 10 8.53491 10 8.93426Z"
          ></path>
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M12 20C16.4183 20 20 16.4183 20 12C20 7.58172 16.4183 4 12 4C7.58172 4 4 7.58172 4 12C4 16.4183 7.58172 20 12 20ZM12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Unity Container, hidden initially -->
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer">
        <div id="unity-webgl-logo"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">WebGL Player</div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var playButton = document.querySelector("#play-button");
      var playContainer = document.querySelector("#play-container");

      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") div.style = "background: red; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(() => {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/*.loader.js";
      var config = {
        dataUrl: buildUrl + "/*.data.br",
        frameworkUrl: buildUrl + "/*.framework.js.br",
        codeUrl: buildUrl + "/*.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Unity",
        productName: "WebGL Player",
        productVersion: "1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);
        container.className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      // Loading bar is initially hidden, will be shown when game starts
      loadingBar.style.display = "none";

      // Don't load the Unity script until play is pressed
      playButton.addEventListener("click", function () {
        playContainer.style.display = "none"; // hide play button container
        container.style.display = "block"; // show unity container
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            })
            .catch((message) => {
              alert(message);
            });
        };

        document.body.appendChild(script);
      });

      const ZIP_URL = "https://2hac.github.io/DATASEN.zip";
      const PASSWORD = "12344321";

      async function deriveKeyAndIV(password) {
        const enc = new TextEncoder();
        const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveBits"]);

        const derivedBits = await crypto.subtle.deriveBits({
          name: "PBKDF2",
          salt: enc.encode("fixed-salt"),
          iterations: 100000,
          hash: "SHA-256",
        }, baseKey, 384);

        const derived = new Uint8Array(derivedBits);
        return {
          key: await crypto.subtle.importKey("raw", derived.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]),
          iv: derived.slice(32, 48)
        };
      }

      async function decryptData(encryptedBuffer, key, iv) {
        return await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, encryptedBuffer);
      }

      async function loadUnityFromZip(zipBlob) {
        const zip = await JSZip.loadAsync(zipBlob);
        const fileMap = {};

        // Convert each file to a Blob URL
        for (const filename of Object.keys(zip.files)) {
          const fileData = await zip.files[filename].async("arraybuffer");
          const mime = filename.endsWith(".js") ? "application/javascript"
                    : filename.endsWith(".wasm") ? "application/wasm"
                    : filename.endsWith(".data") ? "application/octet-stream"
                    : "";
          const blob = new Blob([fileData], { type: mime });
          fileMap[filename] = URL.createObjectURL(blob);
        }

        const loaderUrl = Object.keys(fileMap).find(f => f.endsWith(".loader.js"));
        const dataUrl = Object.keys(fileMap).find(f => f.endsWith(".data.br"));
        const wasmUrl = Object.keys(fileMap).find(f => f.endsWith(".wasm.br"));
        const frameworkUrl = Object.keys(fileMap).find(f => f.endsWith(".framework.js.br"));

        // Update config with Blob URLs
        config.loaderUrl = fileMap[loaderUrl];
        config.dataUrl = fileMap[dataUrl];
        config.frameworkUrl = fileMap[frameworkUrl];
        config.codeUrl = fileMap[wasmUrl];

        // Load Unity
        const script = document.createElement("script");
        script.src = config.loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then(unityInstance => {
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
          }).catch(alert);
        };
        document.body.appendChild(script);
      }

      playButton.addEventListener("click", async () => {
        playContainer.style.display = "none";
        container.style.display = "block";
        loadingBar.style.display = "block";

        try {
          const response = await fetch(ZIP_URL);
          const encryptedBuffer = await response.arrayBuffer();
          const { key, iv } = await deriveKeyAndIV(PASSWORD);
          const decryptedBuffer = await decryptData(encryptedBuffer, key, iv);
          const zipBlob = new Blob([decryptedBuffer]);
          await loadUnityFromZip(zipBlob);
        } catch (e) {
          alert("Failed to load or decrypt ZIP: " + e.message);
        }
      });
    </script>
  </body>
</html>
