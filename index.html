        * {

            background: linear-gradient(rgba(0, 0, 0, .75), rgba(0, 0, 0, .9)), url("assets/backg1.webp");

        .search input {

        .hero {
            max-width: 1400px;

        .hero-box {
            background: rgba(0, 0, 0, .75);
            border: 1px solid #3a5f25;
            padding: 30px

        .hero-title {
            font-size: 42px;
            color: #8cff54;
            margin-bottom: 10px

        .hero-sub {
            color: #aaa

        .content {
            max-width: 80%;
            margin: auto;
            padding: 20px

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px

        .card {
            background: #121212;
            border: 1px solid #2d4f1d;
            transition: .2s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 220px
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: #8cff54;
            box-shadow: 0 0 20px rgba(140, 255, 84, .25)
        }

        .card-top {
            display: flex;
            flex: 1

        .thumb {
            width: 260px;
            min-width: 260px;

            background: #000

        .thumb img {

        .info {

        }

        }

        @media(max-width:1000px) {

        footer {

.search {
    position: relative;
}

.search-options {
    position: absolute;
    top: 45px;
    left: 0;
    width: 220px;
    background: #111;
    border: 1px solid #2f5d1d;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    z-index: 999;
    box-shadow: 0 10px 25px rgba(0,0,0,0.6);
}

.search-options label {
    display: grid;
    grid-template-columns: 18px 1fr;
    align-items: center;

    color: #bbb;

    cursor: pointer;

    padding: 4px 6px;
    border-radius: 4px;
}

    background: #1a1a1a;
    color: #8cff54;
}

/* checkbox alignment fix */

    width: 14px;
    height: 14px;
    margin: 0;
    accent-color: #8cff54;
}

    display: none;

<body>
    <header>
        <div class="pixel-line"></div>
        <div class="topbar">
            <div class="logo" onclick="goHome()">
                2hac.github.io
            </div>
            <div class="search">
                <input id="searchBox" placeholder="Search games..." onclick="toggleSearchOptions()">

                <div id="searchOptions" class="search-options hidden">
                    <a>Search in...</a>
                    <label><input type="checkbox" id="optTitle" checked> Title</label>
                    <label><input type="checkbox" id="optDesc" checked> Description</label>
                    <label><input type="checkbox" id="optGenre" checked> Genre</label>
                </div>
            </div>
        </div>
    </header>
    <div class="content">
        <div id="games" class="games-grid"></div>
    </div>

    <script>
        const JSON_URL = "games.json";
        const GAMES_FOLDER = "Games";
        let ALL = [];

        function getGameId()
        {
            const params = new URLSearchParams(location.search);
            return params.get("g")
        }

        function goHome()
        {
            const url = new URL(window.location.href);
            url.searchParams["delete"]("g");
            history.pushState(
            {}, "", url.pathname + url.search);
            document.querySelector(".search").style.display = "";
            document.getElementById("games").className = "games-grid";
            loadGames()
        }

        async function loadGames()
        {
            const gid = getGameId();
            const r = await fetch(JSON_URL);
            const b64 = await r.text();
            const jsonText = atob(b64);
            ALL = JSON.parse(jsonText);
            if (gid)
            {
                const game = ALL.find(g => String(g.gid) === String(gid));
                if (game)
                {
                    showGame(game)
                }
                else
                {
                    showGame(
                    {
                        gid: gid,
                        rl: gid.startsWith("http") ? gid : null
                    })
                }
                return
            }
            render(ALL)
        }

        function render(games)
        {
            document.getElementById("games").innerHTML = games.map(g =>
            {
                const thumb = `${GAMES_FOLDER}/${g.gid}/Icon.webp`;
                let btnText = "PLAY NOW";
                let btnClass = "play-btn";
                let href = `?g=${g.gid}`;
                let style = "";
                if (g.sta == 1)
                {
                    btnText = "COMING SOON";
                    href = "javascript:void(0)";
                    style = "background:linear-gradient(#f1c40f,#d4ac0d);cursor:not-allowed;"
                }
                else if (g.sta == 2)
                {
                    btnText = "CURRENTLY UNAVAILABLE";
                    href = "javascript:void(0)";
                    style = "background:linear-gradient(#555,#333);cursor:not-allowed;"
                }
                return `
                <div class="card">
                    <div class="card-top">
                        <div class="thumb">
                            <img src="${thumb}">
                        </div>
                        <div class="info">
                            <div class="title">${g.title}</div>
                            <div class="desc">${g.description}</div>
                            <div class="meta">${g.genre}</div>
                            <div class="meta">Date: ${g.date}</div>
                        </div>
                    </div>
                    <a
                        class="play-btn"
                        href="${href}"
                        style="${style}">
                        ${btnText}
                    </a>
                </div>
                `
            }).join("")
        }
        async function showGame(game)
        {
            const games = document.getElementById("games");
            document.querySelector(".search").style.display = "none";
            games.className = "";
            const hasExternalURL = game.rl && typeof game.rl === "string" && game.rl.startsWith("http");
            let src;
            if (hasExternalURL)
            {
                src = game.rl
            }
            else
            {
                src = `${GAMES_FOLDER}/${game.gid}/index.html`;
                try
                {
                    const res = await fetch(src,
                    {
                        method: "HEAD"
                    });
                    if (!res.ok) throw new Error("HTTP " + res.status)
                }
                catch (e)
                {
                    console.warn("Game not found:", e);
                    games.innerHTML = `
                        <div style="
                            width:100%;
                            height:calc(100vh - 160px);
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:black;
                        ">
                            <img src="assets/error.webp"
                                style="width:100%;height:100%;object-fit:contain;">
                        </div>
                    `;
                    return
                }
            }
            games.innerHTML = `
                <iframe
                    id="gameFrame"
                    src="${src}"
                    style="
                        width:100%;
                        height:calc(100vh - 160px);
                        border:none;
                        background:black;
                    ">
                </iframe>
            `
        }

const searchBox = document.getElementById("searchBox");
const searchOptions = document.getElementById("searchOptions");

const optTitle = document.getElementById("optTitle");
const optDesc = document.getElementById("optDesc");
const optGenre = document.getElementById("optGenre");

function toggleSearchOptions()
{
    searchOptions.classList.toggle("hidden");
}
document.addEventListener("click", (e) =>
{
    if (!e.target.closest(".search"))
    {
        searchOptions.classList.add("hidden");
    }
});
function doSearch()
{
    const q = searchBox.value.toLowerCase().trim();

    if (!q)
    {
        render(ALL);
        return;
    }

    const filtered = ALL.filter(g =>
    {
        let match = false;

        if (optTitle.checked && g.title)
        {
            match = match || g.title.toLowerCase().includes(q);
        }

        if (optDesc.checked && g.description)
        {
            match = match || g.description.toLowerCase().includes(q);
        }

        if (optGenre.checked && g.genre)
        {
            match = match || g.genre.toLowerCase().includes(q);
        }

        return match;
    });

    render(filtered);
}

searchBox.addEventListener("input", doSearch);
optTitle.addEventListener("change", doSearch);
optDesc.addEventListener("change", doSearch);
optGenre.addEventListener("change", doSearch);

        window.addEventListener("DOMContentLoaded", loadGames);
    </script>
