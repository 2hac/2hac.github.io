<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send Feedback</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f0f0f;
    font-family:Tahoma,Arial,sans-serif;
    padding:15px;
}

select,
textarea{
    width:100%;
    background:#181818;
    border:2px solid #2f5d1d;
    color:#fff;
    padding:12px;
    font-size:14px;
    outline:none;
    margin-bottom:10px;
}

select:focus,
textarea:focus{
    border-color:#8cff54;
}

textarea{
    height:140px;
    resize:vertical;
}

button{
    width:100%;
    padding:14px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    text-transform:uppercase;
    color:white;
    background:linear-gradient(#75c945,#4b8f28);
}

button:hover{
    filter:brightness(1.1);
}

#result{
    margin-top:10px;
    color:#8cff54;
    font-size:14px;
}
</style>
</head>

<body>

<select id="type">
    <option value="INFO">Information</option>
    <option value="BUG">Bug Report</option>
    <option value="REQUEST">Game Request</option>
    <option value="OTHER">Other</option>
</select>

<textarea
    id="msg"
    placeholder="Type your message..."
></textarea>

<button onclick="sendMessage()">
    Send Message
</button>

<div id="result"></div>

<script>
async function sendMessage()
{
    const type = document.getElementById('type').value;
    const msg = document.getElementById('msg').value.trim();

    if(!msg)
    {
        document.getElementById('result').textContent =
            'Enter a message.';
        return;
    }

    try
    {
        const response = await fetch(
            'https://pw-5--caemloqacveg.replit.app/api/v1/msg.php',
            {
                method:'POST',
                headers:{
                    'Content-Type':
                    'application/x-www-form-urlencoded'
                },
                body:
                    'type=' + encodeURIComponent(type) +
                    '&msg=' + encodeURIComponent(msg)
            }
        );

        await response.text();

        document.getElementById('result').textContent =
            '✓ Message sent';

        document.getElementById('msg').value = '';
    }
    catch(err)
    {
        document.getElementById('result').textContent =
            '✗ Failed to send';
    }
}
</script>

</body>
</html>
